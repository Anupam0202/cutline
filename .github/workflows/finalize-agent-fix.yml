name: one-time-finalize-agent-fix

on:
  push:
    branches: [fix/agent-engine-secrets]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Finalize source and documentation
        shell: bash
        run: |
          python -m pip install ruff==0.16.5
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/GCP_SETUP.md")
          text = path.read_text(encoding="utf-8")
          old_auth = '''## 2. Install and authenticate the CLI

```bash
gcloud version
gcloud auth login
gcloud auth application-default login
gcloud config set project "$GOOGLE_CLOUD_PROJECT"
gcloud config set run/region "$GOOGLE_CLOUD_LOCATION"
```
'''
          new_auth = '''## 2. Select the project and verify authentication

Google Cloud Shell is the recommended deployment environment. It already includes an authenticated Google Cloud CLI, so do not run interactive login commands there.

```bash
gcloud version
gcloud auth list --filter=status:ACTIVE --format='value(account)'
gcloud config set project "$GOOGLE_CLOUD_PROJECT"
gcloud config set run/region "$GOOGLE_CLOUD_LOCATION"
gcloud projects describe "$GOOGLE_CLOUD_PROJECT" --format='value(lifecycleState)'
gcloud billing projects describe "$GOOGLE_CLOUD_PROJECT" --format='value(billingEnabled)'
```

For a local workstation only, authenticate with `gcloud auth login` and `gcloud auth application-default login` before running local credentialed tests.
'''
          old_agent = '''export GOOGLE_GENAI_USE_VERTEXAI=TRUE
export MODEL_ID='gemini-3.5-flash'
export PARALLEL_API_KEY   # use only in an authorized local deployment shell
./scripts/deploy_agent_engine.sh
```

The command prints an Agent Engine resource name similar to:
'''
          new_agent = '''export GOOGLE_GENAI_USE_VERTEXAI=TRUE
export MODEL_ID='gemini-3.5-flash'
./scripts/deploy_agent_engine.sh
```

Do not export the Parallel credential for the remote deployment. The ADK tool retrieves `parallel-api-key` from Secret Manager at runtime using the Agent Engine identity; the deployment script grants that identity access only to this secret.

The command prints an Agent Engine resource name similar to:
'''
          if old_auth not in text or old_agent not in text:
              raise SystemExit("Expected GCP setup sections were not found")
          path.write_text(text.replace(old_auth, new_auth).replace(old_agent, new_agent), encoding="utf-8")
          PY
          ruff format .
          ruff check .
          rm -rf .ruff_cache
          rm -f .github/workflows/finalize-agent-fix.yml
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          from pathlib import Path

          root = Path(".")
          files = sorted(
              path
              for path in root.rglob("*")
              if path.is_file()
              and ".git" not in path.parts
              and path.name != "SHA256SUMS"
          )
          lines = [
              f"{hashlib.sha256(path.read_bytes()).hexdigest()}  ./{path.as_posix()}"
              for path in files
          ]
          Path("SHA256SUMS").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          git config user.name 'Anupam Roy'
          git config user.email 'anupam020202@gmail.com'
          git add -A
          git commit -m 'Finalize Agent Engine secret handling'
          git push origin "HEAD:${{ github.ref_name }}"
