name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install '.[test]'
      - name: Python lint
        run: ruff check .
      - name: Python format
        run: ruff format --check .
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Browser source syntax
        run: node --check static/app.js
      - name: Repository policy
        run: python scripts/validate_repo.py
      - name: Container build
        run: docker build --tag cutline:${{ github.sha }} .
