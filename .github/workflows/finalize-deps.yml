name: one-time-finalize-dependency-update

on:
  push:
    branches: [chore/consolidate-dependabot-updates]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Regenerate checksums
        shell: bash
        run: |
          rm -f .github/workflows/finalize-deps.yml
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          from pathlib import Path

          files = sorted(
              path
              for path in Path(".").rglob("*")
              if path.is_file()
              and ".git" not in path.parts
              and path.name != "SHA256SUMS"
          )
          lines = [
              f"{hashlib.sha256(path.read_bytes()).hexdigest()}  ./{path.as_posix()}"
              for path in files
          ]
          Path("SHA256SUMS").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          git config user.name 'Anupam Roy'
          git config user.email 'anupam020202@gmail.com'
          git add -A
          git commit -m 'Finalize validated dependency updates'
          git push origin "HEAD:${{ github.ref_name }}"
