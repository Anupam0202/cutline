name: one-time-ruff-autofix

on:
  push:
    branches: [fix/release-readiness]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: python -m pip install ruff==0.16.5
      - name: Format and commit
        shell: bash
        run: |
          ruff format .
          ruff check . --fix || true
          rm .github/workflows/autofix.yml
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          from pathlib import Path

          root = Path(".")
          files = sorted(
              path
              for path in root.rglob("*")
              if path.is_file()
              and ".git" not in path.parts
              and path.name != "SHA256SUMS"
          )
          lines = [
              f"{hashlib.sha256(path.read_bytes()).hexdigest()}  ./{path.as_posix()}"
              for path in files
          ]
          Path("SHA256SUMS").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          git config user.name 'Anupam Roy'
          git config user.email 'anupam020202@gmail.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Apply Ruff formatting and release metadata'
          git push origin "HEAD:${{ github.ref_name }}"
