[build-system]
requires = ["setuptools>=80,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "cutline-cinema"
version = "1.0.0"
description = "Version-bound documentary fact review with Gemini and Parallel Search"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { file = "LICENSE" }
authors = [{ name = "Anupam Roy", email = "anupam020202@gmail.com" }]
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.4",
  "pydantic==2.13.5",
  "google-adk==2.8.0",
  "google-cloud-aiplatform[agent_engines,adk]==1.165.1",
  "google-genai==2.22.0",
  "google-cloud-firestore==2.30.0",
  "google-cloud-secret-manager==2.30.0",
  "parallel-web==1.3.3",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "ruff==0.16.6",
]

[tool.setuptools.packages.find]
include = ["cutline*"]

[tool.ruff]
target-version = "py312"
line-length = 110
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
